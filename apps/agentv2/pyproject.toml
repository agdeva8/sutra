[project]
name = "sutra-agentv2"
version = "0.1.0"
description = "The Sutra planning agent as a library: plain functions, no HTTP, no database driver."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "langchain-deepseek>=0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The package is this directory itself, imported as `agentv2`.
[tool.setuptools]
package-dir = { agentv2 = "." }
packages = [
    "agentv2", "agentv2.chatplan", "agentv2.coach", "agentv2.contracts", "agentv2.core", "agentv2.entrychat", "agentv2.gateway", "agentv2.intake",
    "agentv2.planner", "agentv2.prompts", "agentv2.triage",
]
