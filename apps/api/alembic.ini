# Alembic — schema migrations for apps/api.
#
# There is no hand-written initial migration on purpose. The models in
# `sutra_api/models.py` are the schema of record, and autogenerate reads them —
# a hand-written first migration would be a second copy of 21 tables that starts
# drifting the moment either side changes.
#
#   cd apps/api
#   set -a; source .env; set +a
#   .venv/bin/alembic revision --autogenerate -m "initial schema"
#   .venv/bin/alembic upgrade head
#
# `sqlalchemy.url` is deliberately empty: `migrations/env.py` reads
# `settings.ddl_url`, so there is one place the database URL lives, and a
# credential never lands in a committed file.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Timestamp-prefixed filenames, so the directory tells you the order by eye.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
