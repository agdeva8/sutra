[project]
name = "sutra-agent"
version = "0.1.0"
description = "Sutra planning & replanning agent — LangGraph orchestration over a deterministic core, with OR-Tools CP-SAT placement."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "langsmith>=0.4",
    "ortools>=9.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Imported directly by `app/llm/client.py` for the OpenAI-compatible wire
    # call. It resolved transitively (via langsmith/openai) until now, so a bump
    # of either could have removed the HTTP client from under the one code path
    # that talks to a model.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # `langgraph dev` — the local Agent Server that LangSmith Studio connects
    # to (`langgraph.json` → `app/studio.py`). `[inmem]` is the in-memory
    # variant; it needs no Postgres, which is what keeps Studio a scratch
    # surface next to the real store in `apps/api`.
    "langgraph-cli[inmem]>=0.4",
]

[project.scripts]
sutra-agent = "app.tui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
