<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
        <meta name="theme-color" content="#FFFFFF" />
        <meta name="description" content="Sutra - let's sort your life - together." />
        <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
        <link rel="alternate icon" href="%PUBLIC_URL%/favicon.ico" />
        <!-- PWA: manifest makes the site installable (Chrome/Edge fire
             beforeinstallprompt; Safari/iOS uses the Share → Add to Home
             Screen path instead). Icons live in public/icons/. -->
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/apple-touch-icon.png" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="Sutra" />
        <script>
            // Apply the persisted theme before React mounts so we don't
            // get a flash of the wrong theme on every reload. Light is
            // the product default; a stored choice always wins.
            (function () {
                try {
                    var t = localStorage.getItem("sutra_theme") || "light";
                    if (t === "light") document.documentElement.classList.add("light");
                } catch (e) { /* localStorage blocked — keep default light */ }
            })();
            // Same idea for the user-chosen text size: pin
            // --sutra-font-scale on <html> before paint so all rem-based
            // Tailwind text utilities scale together without a one-frame
            // flash. The Settings page owns the writing side; this just
            // hydrates the CSS variable from localStorage.
            (function () {
                try {
                    var s = localStorage.getItem("sutra_font_size");
                    if (s) document.documentElement.style.setProperty("--sutra-font-scale", s + "px");
                } catch (e) { /* localStorage blocked — fall back to 16px (the default in index.css) */ }
            })();
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>Sutra - let's sort your life - together.</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    </body>
</html>
